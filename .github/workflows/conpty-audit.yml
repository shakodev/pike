name: ConPTY resource audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources:
    name: ConPTY audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record OS and compiler
        run: |
          New-Item -ItemType Directory -Force target/audit | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | ConvertTo-Json | Set-Content target/audit/os.json
          rustc --version --verbose | Tee-Object target/audit/compiler.txt
      - name: Measure 100 failed launches and close cycles in isolation
        run: |
          cargo test --release --locked -p alacritty_terminal tty::windows::conpty::tests::resource_cycles -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object target/audit/resources.txt
          exit $LASTEXITCODE
      - name: Retain synthetic measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conpty-audit-${{ matrix.os }}
          path: target/audit
