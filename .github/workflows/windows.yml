name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Rust checks (Windows MSVC, ${{ matrix.renderer }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        renderer: [wgpu, tiny-skia]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install and show pinned toolchain
        run: rustup show

      - name: Show compiler and Cargo versions
        run: |
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: Windows-2025-${{ runner.arch }}-msvc-v2-${{ matrix.renderer }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/iced_term/Cargo.toml', 'vendor/alacritty_terminal/Cargo.toml') }}

      - name: Verify renderer and runtime feature isolation
        run: ./tools/test-feature-profiles.ps1

      - name: Test feature guard regressions
        run: ./tools/test-feature-profile-guard.ps1

      - name: Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features renderer-${{ matrix.renderer }} -- -D warnings

      - name: Test application
        run: cargo test --locked --no-default-features --features renderer-${{ matrix.renderer }}

      - name: Test compatibility examples
        run: cargo test --locked --examples --no-default-features --features renderer-${{ matrix.renderer }}

      - name: Test measurement support
        run: ./tools/test-compatibility-support.ps1

      - name: Test vendored iced_term explicitly
        env:
          PIKE_TRACE_CLEANUP: '1'
        run: cargo test --locked -p iced_term --lib --no-default-features --features iced/${{ matrix.renderer }},iced/tokio -- --nocapture

      - name: Lint vendored iced_term explicitly
        run: cargo clippy --locked -p iced_term --all-targets --no-default-features --features iced/${{ matrix.renderer }},iced/tokio -- -D warnings

      - name: Test vendored Alacritty explicitly
        run: cargo test --locked -p alacritty_terminal

      - name: Lint vendored Alacritty explicitly
        run: cargo clippy --locked -p alacritty_terminal --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked --no-default-features --features renderer-${{ matrix.renderer }}

      - name: Build compatibility examples
        run: cargo build --release --locked --examples --no-default-features --features renderer-${{ matrix.renderer }}

      - name: Check bounded input with Windows ConPTY
        run: ./tools/measure-input-backlog.ps1 -OutputDirectory "${{ runner.temp }}/pike-input-backlog-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Check shutdown completion with Windows ConPTY
        run: ./tools/measure-shutdown-lifecycle.ps1 -OutputDirectory "${{ runner.temp }}/pike-shutdown-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Verify dependency files are unchanged
        run: git diff --exit-code -- Cargo.toml Cargo.lock rust-toolchain.toml vendor/iced_term/Cargo.toml vendor/iced_term/Cargo.lock vendor/alacritty_terminal/Cargo.toml vendor/alacritty_terminal/Cargo.lock
