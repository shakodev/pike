name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Rust checks (Windows MSVC, ${{ matrix.renderer }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        renderer: [wgpu, tiny-skia]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install and show pinned toolchain
        run: rustup show

      - name: Show compiler and Cargo versions
        run: |
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: Windows-2025-${{ runner.arch }}-msvc-v2-${{ matrix.renderer }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/iced_term/Cargo.toml', 'vendor/alacritty_terminal/Cargo.toml') }}

      - name: Verify renderer and runtime feature isolation
        run: ./tools/test-feature-profiles.ps1

      - name: Prepare pinned ConPTY runtime
        run: |
          ./tools/prepare-conpty.ps1
          ./tools/test-conpty-runtime.ps1

      - name: Test feature guard regressions
        run: ./tools/test-feature-profile-guard.ps1

      - name: Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features renderer-${{ matrix.renderer }} -- -D warnings

      - name: Test application
        run: cargo test --locked --no-default-features --features renderer-${{ matrix.renderer }}

      - name: Test compatibility examples
        run: cargo test --locked --examples --no-default-features --features renderer-${{ matrix.renderer }}

      - name: Test measurement support
        run: ./tools/test-compatibility-support.ps1

      - name: Test vendored iced_term explicitly
        env:
          PIKE_TRACE_CLEANUP: '1'
        run: cargo test --locked -p iced_term --lib --no-default-features --features iced/${{ matrix.renderer }},iced/tokio -- --nocapture

      - name: Lint vendored iced_term explicitly
        run: cargo clippy --locked -p iced_term --all-targets --no-default-features --features iced/${{ matrix.renderer }},iced/tokio -- -D warnings

      - name: Test vendored Alacritty explicitly
        run: cargo test --locked -p alacritty_terminal

      - name: Lint vendored Alacritty explicitly
        run: cargo clippy --locked -p alacritty_terminal --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked --no-default-features --features renderer-${{ matrix.renderer }}

      - name: Package release with pinned native runtime
        run: ./tools/package-windows.ps1 -OutputDirectory "${{ runner.temp }}/pike-package-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Build compatibility examples
        run: cargo build --release --locked --examples --no-default-features --features renderer-${{ matrix.renderer }}

      - name: Check legacy keyboard bytes and editor with Windows ConPTY
        timeout-minutes: 3
        run: |
          $output = "${{ runner.temp }}/pike-keyboard-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}"
          $vim = Join-Path $env:ProgramFiles 'Git/usr/bin/vim.exe'
          if (-not (Test-Path -LiteralPath $vim)) { throw 'Git for Windows Vim is required for the synthetic editor check.' }
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & ./target/release/examples/keyboard_input.exe $output $vim (Join-Path $PSHOME 'pwsh.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $timer.Stop()
          foreach ($mode in @('normal', 'application', 'newline', 'application-newline')) {
            $fixtureId = [int](Get-Content -LiteralPath (Join-Path $output "$mode/ready") -Raw)
            $child = Get-Process -Id $fixtureId -ErrorAction SilentlyContinue
            if ($child) {
              try {
                if ($child.ProcessName -eq 'input_fixture') { throw "Keyboard fixture $fixtureId survived acknowledged cleanup." }
              } finally { $child.Dispose() }
            }
          }
          [ordered]@{
            Commit = '${{ github.sha }}'
            Renderer = '${{ matrix.renderer }}'
            RunnerOS = (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber)
            ExecutableSha256 = (Get-FileHash ./target/release/examples/keyboard_input.exe -Algorithm SHA256).Hash
            ElapsedMilliseconds = $timer.Elapsed.TotalMilliseconds
            Scope = 'Synthetic Iced events through widget, bounded writer, native ConPTY, Vim and profile-free PowerShell/PSReadLine; excludes physical layouts.'
            FixtureCleanup = 'All four fixture PIDs absent after acknowledged shutdown.'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $output 'provenance.json') -Encoding UTF8
          Get-Content -LiteralPath (Join-Path $output 'summary.csv')
          Get-Content -LiteralPath (Join-Path $output 'editor.txt')
          Get-Content -LiteralPath (Join-Path $output 'psreadline.txt')

      - name: Check Windows layout translation through the actual Iced window
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: ./tools/test-keyboard-layout.ps1 -OutputDirectory "${{ runner.temp }}/pike-keyboard-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}/os-layout"

      - name: Retain synthetic keyboard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keyboard-input-${{ matrix.renderer }}
          path: ${{ runner.temp }}/pike-keyboard-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn

      - name: Check Windows launch arguments, shells, cwd and environment
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & ./target/release/examples/launch_validation.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $timer.Stop()
          Write-Host "Complete synthetic launch suite: $($timer.Elapsed.TotalMilliseconds) ms"

      - name: Check bounded input with Windows ConPTY
        run: ./tools/measure-input-backlog.ps1 -OutputDirectory "${{ runner.temp }}/pike-input-backlog-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Check shutdown completion with Windows ConPTY
        run: ./tools/measure-shutdown-lifecycle.ps1 -OutputDirectory "${{ runner.temp }}/pike-shutdown-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Verify dependency files are unchanged
        run: git diff --exit-code -- Cargo.toml Cargo.lock rust-toolchain.toml vendor/iced_term/Cargo.toml vendor/iced_term/Cargo.lock vendor/alacritty_terminal/Cargo.toml vendor/alacritty_terminal/Cargo.lock
